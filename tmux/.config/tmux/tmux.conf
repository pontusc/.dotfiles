# Set color support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# -- Settings
# Start windows and panes on 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-keys vi
set -g mouse on
unbind -T root MouseDown2Pane
set -g focus-events on          # required for vim-tmux-navigator and autoread
set -s escape-time 0            # no delay after pressing Esc (important for vim)
set -g display-time 4000        # display messages for 4 seconds
set -g status-interval 5        # refresh status bar every 5 seconds
setw -g aggressive-resize on    # resize window to smallest client actively viewing it
set -g detach-on-destroy off  # don't exit from tmux when closing a session
set -g update-environment "HYPRLAND_INSTANCE_SIGNATURE"  # pass Hyprland socket to new sessions

# -- Keybinds
# Leader
unbind C-b
set -g prefix `
bind ` send-prefix
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt
# Session picker starting from index 1 (default starts at 0)
bind -T prefix s choose-tree -s -Z -K "#{?#{e|<:#{line},9},#{e|+:#{line},1},#{?#{e|<:#{line},36},M-#{a:#{e|+:97,#{e|-:#{line},10}}},}}"

# General
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
# Change so in copy mode (leader+[) enter line select with v only, and toggle block select with Ctrl+v
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open splits and panes in same directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind A run-shell "~/.config/tmux/dev-layout.sh"
# Create/focus a git worktree in a new window with the dev layout (leader+W)
bind W display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "~/.config/tmux/worktree-new.sh"

# -- Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Vim-tmux-navigator: seamless Alt+hjkl navigation between vim splits and tmux panes
set -g @plugin 'christoomey/vim-tmux-navigator'
# Unbind plugin defaults (Ctrl+hjkl / Ctrl+Arrow) in favor of Alt+hjkl below
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
unbind -n C-Left
unbind -n C-Right
unbind -n C-Up
unbind -n C-Down
set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_down "M-j"
set -g @vim_navigator_mapping_prev ""  # disable "previous pane" mapping

# Pane resize (Alt+Shift+hjkl)
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# Sesh
bind-key "t" run-shell "sesh connect \"$(
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡  ' \
    --header '  ^a all ^t tmux ^g configs ^x zoxide ^d tmux kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡  )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟  )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁  )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎  )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡  )+reload(sesh list --icons)' \
    --preview-window 'right:55%' \
    --preview 'sesh preview {}'
)\""

# THEME
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_separator_style "slant"
set -g @powerkit_edge_separator_style "slant"
set -g @powerkit_status_position "bottom"
set -g @powerkit_plugins ""
set -g @powerkit_session_icon "auto"
set -g @powerkit_window_index_style "text"
set -g @powerkit_pane_border_lines "heavy"

# Session save/restore (after theme so status-right isn't overwritten)
# NOTE: leader+W worktree windows are captured here. After `git worktree remove`,
# a restore may recreate them as ghost windows pointing at the deleted path —
# just close those manually.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
