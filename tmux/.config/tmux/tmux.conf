# Set color support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# -- Settings
# Start windows and panes on 1
set -g base-index 1
setw -g pane-base-index 1
set -g mode-keys vi
set -g status-keys vi
set -g mouse on
set -g focus-events on
set -s escape-time 0
set -g display-time 4000
set -g status-interval 5
setw -g aggressive-resize on

# -- Tweaks
# Adds a 2nd invisible status bar to act as padding
if -F '#{!=:#{status},2}' {
    set -Fg 'status-format[1]' '#{status-format[0]}'
    set -g 'status-format[0]' ''
    set -g status 2
}

# -- Keybinds
# Leader
unbind C-b
set -g prefix `
bind ` send-prefix

# General
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
# Change so in copy mode (leader+[) enter line select with v only, and toggle block select with Ctrl+v
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# -- Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Vim navigator conf
set -g @plugin 'christoomey/vim-tmux-navigator'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
set -g @vim_navigator_mapping_left "C-Left"
set -g @vim_navigator_mapping_right "C-Right"
set -g @vim_navigator_mapping_up "C-Up"
set -g @vim_navigator_mapping_down "C-Down"
set -g @vim_navigator_mapping_prev ""

# THEME
set -g @plugin 'fabioluciano/tmux-tokyo-night'
set -g @theme_transparent_status_bar 'true'
set -g @theme_disable_plugins 1

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
