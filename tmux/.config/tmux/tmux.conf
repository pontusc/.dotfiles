# Set color support
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# Allow apps to pass escape sequences straight to the host terminal
# (kitty graphics protocol for inline images via snacks.image). tmux >= 3.3a.
set -g allow-passthrough all

# -- Settings
# Start windows and panes on 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g mode-keys vi
set -g status-keys vi
set -g mouse on
unbind -T root MouseDown2Pane
set -g focus-events on          # required for vim-tmux-navigator and autoread
set -s escape-time 0            # no delay after pressing Esc (important for vim)
set -g display-time 4000        # display messages for 4 seconds
set -g status-interval 5        # refresh status bar every 5 seconds
setw -g aggressive-resize on    # resize window to smallest client actively viewing it
set -g detach-on-destroy off  # don't exit from tmux when closing a session
set -g update-environment "HYPRLAND_INSTANCE_SIGNATURE"  # pass Hyprland socket to new sessions

# -- Keybinds
# Leader
unbind C-b
set -g prefix `
bind ` send-prefix
bind-key x kill-pane # skip "kill-pane 1? (y/n)" prompt

# General
bind R source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"
# Change so in copy mode (leader+[) enter line select with v only, and toggle block select with Ctrl+v
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Open splits and panes in same directory
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind A run-shell "~/.config/tmux/dev-layout.sh"
# Create/focus a git worktree in a new window with the dev layout (leader+W)
bind W display-popup -E -w 80% -h 70% -d "#{pane_current_path}" "~/.config/tmux/worktree-new.sh"
# Compose a ticket session from picked repos (leader+T)
bind T run-shell -b "~/.config/tmux/workspace/main.py flow"
# Add a repo to the current session (leader+E)
bind E display-popup -E -s "bg=terminal" -w 80 -h 24 "~/.config/tmux/workspace/main.py add"
# Close current-session windows that lose nothing (leader+X)
bind X display-popup -E -s "bg=terminal" -w 80 -h 24 "~/.config/tmux/workspace/main.py cleanup"
# Pick another session by slot number or fuzzy name (leader+s)
bind s display-popup -E -s "bg=terminal" -w 44 -h 14 "~/.config/tmux/workspace/main.py switch"

# -- Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'alexwforsythe/tmux-which-key'

# Vim-tmux-navigator: seamless Alt+hjkl navigation between vim splits and tmux panes
set -g @plugin 'christoomey/vim-tmux-navigator'
# Unbind plugin defaults (Ctrl+hjkl / Ctrl+Arrow) in favor of Alt+hjkl below
unbind -n C-h
unbind -n C-j
unbind -n C-k
unbind -n C-l
unbind -n C-Left
unbind -n C-Right
unbind -n C-Up
unbind -n C-Down
set -g @vim_navigator_mapping_left "M-h"
set -g @vim_navigator_mapping_right "M-l"
set -g @vim_navigator_mapping_up "M-k"
set -g @vim_navigator_mapping_down "M-j"
set -g @vim_navigator_mapping_prev ""  # disable "previous pane" mapping

# Pane resize (Alt+Shift+hjkl)
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# THEME
set -g @plugin 'fabioluciano/tmux-powerkit'
set -g @powerkit_theme "tokyo-night"
set -g @powerkit_separator_style "slant"
set -g @powerkit_edge_separator_style "slant"
set -g @powerkit_status_position "bottom"
set -g @powerkit_plugins ""
# Pinned to Arch glyph: powerkit's "auto" reads ID=cachyos from /etc/os-release,
# which it has no case for, so it falls back to the generic Tux penguin.
set -g @powerkit_session_icon ""
set -g @powerkit_window_index_style "text"
set -g @powerkit_pane_border_lines "heavy"

# Session save/restore (after theme so status-right isn't overwritten)
# NOTE: leader+W worktree windows are captured here. After `git worktree remove`,
# a restore may recreate them as ghost windows pointing at the deleted path —
# just close those manually.
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
