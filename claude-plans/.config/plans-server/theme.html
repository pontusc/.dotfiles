<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$if(title)$$title$ — Plan$else$Plan$endif$</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --border:#30363d;
    --fg:#e6edf3; --muted:#9aa7b4; --accent:#4493f8; --good:#3fb950;
    --warn:#d29922; --bad:#f85149; --code:#1f2630;
    --maxw:980px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline}
  .layout{display:flex;min-height:100vh}
  nav{position:sticky;top:0;align-self:flex-start;width:268px;height:100vh;
    overflow-y:auto;background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;flex:0 0 auto}
  nav > h1{font-size:14px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
  nav ul{list-style:none;margin:0;padding:0;counter-reset:s}
  nav li{counter-increment:s;margin:1px 0}
  nav li a{display:block;padding:5px 9px;border-radius:6px;color:var(--fg);font-size:13.5px}
  nav li a::before{content:counter(s) ".";color:var(--muted);margin-right:7px}
  nav li a:hover{background:var(--panel2);text-decoration:none}
  main{flex:1 1 auto;max-width:var(--maxw);margin:0 auto;padding:34px 40px 120px;counter-reset:sec}
  header.hero{border-bottom:1px solid var(--border);padding-bottom:20px;margin-bottom:8px}
  header.hero h1{font-size:30px;margin:0 0 6px}
  header.hero p{color:var(--muted);margin:4px 0}
  section.level1{padding-top:34px;margin-top:8px;border-top:1px solid var(--border);counter-increment:sec}
  section.level1:first-of-type{border-top:none}
  section.level1 > h1{font-size:22px;margin:0 0 14px;scroll-margin-top:18px}
  section.level1 > h1::before{content:counter(sec) ". ";color:var(--accent);font-weight:600;margin-right:4px}
  h2{font-size:16.5px;margin:22px 0 8px;color:#cdd9e5}
  p{margin:10px 0}
  code{background:var(--code);padding:1.5px 6px;border-radius:5px;font-size:13px;
    font-family:"SFMono-Regular",ui-monospace,Menlo,Consolas,monospace}
  pre{background:var(--code);border:1px solid var(--border);border-radius:8px;
    padding:14px 16px;overflow-x:auto;font-size:12.8px;line-height:1.55}
  pre code{background:none;padding:0}
  table{border-collapse:collapse;width:100%;margin:14px 0;font-size:13.5px}
  th,td{border:1px solid var(--border);padding:8px 11px;text-align:left;vertical-align:top}
  th{background:var(--panel2);font-weight:600}
  tr:nth-child(even) td{background:rgba(255,255,255,.015)}
  ul,ol{margin:10px 0;padding-left:22px}
  li{margin:5px 0}
  .pill{display:inline-block;font-size:11px;font-weight:600;padding:2px 9px;border-radius:999px;
    text-transform:uppercase;letter-spacing:.03em;vertical-align:middle}
  .pill.ok{background:rgba(63,185,80,.15);color:var(--good);border:1px solid rgba(63,185,80,.4)}
  .pill.gap{background:rgba(248,81,73,.13);color:var(--bad);border:1px solid rgba(248,81,73,.4)}
  .pill.partial{background:rgba(210,153,34,.13);color:var(--warn);border:1px solid rgba(210,153,34,.4)}
  .callout{border-left:3px solid var(--accent);background:var(--panel);padding:12px 16px;
    border-radius:0 8px 8px 0;margin:16px 0}
  .callout.warn{border-color:var(--warn)}
  .callout.bad{border-color:var(--bad)}
  .callout.good{border-color:var(--good)}
  .callout .t{font-weight:700;display:block;margin-bottom:4px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px 16px}
  .muted{color:var(--muted)}
  .src{font-size:12px;color:var(--muted)}
  .tag{font-size:11px;color:var(--muted);border:1px solid var(--border);border-radius:5px;padding:1px 6px}
  hr{border:none;border-top:1px solid var(--border);margin:24px 0}
  @media(max-width:880px){nav{display:none}main{padding:24px 18px 80px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="layout">
<nav>
  <h1>Plan Sections</h1>
  $table-of-contents$
</nav>
<main>
<header class="hero">
  <h1>$title$</h1>
$if(subtitle)$
  <p>$subtitle$</p>
$endif$
  <p class="muted">$if(date)$Prepared $date$$endif$$if(scope)$ · scope: <code>$scope$</code>$endif$</p>
</header>
$body$
</main>
</div>
</body>
</html>
