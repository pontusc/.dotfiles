# Theme: Tokyo Night (night variant), vendored in theme.conf
include theme.conf

# Match alacritty [env] TERM
term xterm-256color

# Font (alacritty: JetBrainsMono Nerd Font Mono, size 13)
font_family      JetBrainsMono Nerd Font Mono
bold_italic_font auto
font_size        13.0

# Disable programming ligatures entirely (matches alacritty, which never
# rendered them). Font/shaping change — needs a full kitty restart, not reload.
disable_ligatures always

# Thinner light-on-dark text, matching alacritty's weight. kitty 0.28+ defaults
# to `platform` (sRGB-linear blending) which renders light-on-dark heavier, and
# its tuning params can only thicken further on a dark theme — `legacy` is the
# only strategy that thins it. Opaque window, fixed dark theme, so the gamma-
# correctness we give up here is moot.
text_composition_strategy legacy

# Window (alacritty: padding 14/14, decorations = None)
# NOTE: kitty padding is in pt, alacritty's was px. 9pt ~= alacritty's 14px at this DPI.
window_padding_width    9
hide_window_decorations yes
confirm_os_window_close 0

# Transparency + blur (KDE Plasma Wayland; KWin implements the Wayland blur
# extension kitty needs). background_blur only applies while opacity < 1.
background_opacity         0.85
background_blur            32
dynamic_background_opacity yes

# Keybindings:
#   Super+C      -> Copy   (Ctrl+C stays SIGINT)
#   Super+V      -> Paste  (Ctrl+V stays literal ^V)
#   F11          -> ToggleFullscreen
#   Shift+Return -> send a newline
# On Hyprland the compositor grabs Super+C/V and forwards Ctrl+Insert /
# Shift+Insert instead (hypr binds.lua universal copy/paste) — map those to
# the clipboard too. Shift+Insert would otherwise paste the primary selection.
map super+c      copy_to_clipboard
map super+v      paste_from_clipboard
map ctrl+insert  copy_to_clipboard
map shift+insert paste_from_clipboard
map f11          toggle_fullscreen
map shift+enter  send_text all \n

# OSC52 read+write (= alacritty terminal.osc52 = "CopyPaste")
clipboard_control write-clipboard write-primary read-clipboard read-primary no-append

# Mouse: middle-click passes through to app (= alacritty Middle = ReceiveChar)
mouse_map middle release ungrabbed no_op

# Basic-terminal behavior (tmux is the sole window manager; no kitty tabs/remote control)
cursor_shape          block
cursor_blink_interval 0
shell_integration     no-cursor
enable_audio_bell     no
