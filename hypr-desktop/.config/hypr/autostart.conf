# Extra autostart processes
# exec-once = uwsm app -- my-service

exec-once = teamspeak3
exec-once = uwsm app -- Discord.desktop
exec-once = hyprctl dispatch resizewindowpixel 0 -300, class:^.*-discord.*$
exec-once = xrandr --output DP-1 --primary
# Move mouse to workspace 1
exec-once = hyprctl dispatch workspace 1
