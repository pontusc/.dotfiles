$browser = uwsm app -- vivaldi-stable --new-window --ozone-platform=wayland

# Lock (moved to SUPER+CTRL+L, available via omarchy defaults in utilities.conf)
unbind = SUPER, L

# Application bindings
bindd = SUPER, RETURN, Terminal, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)"
bindd = SUPER ALT, RETURN, Tmux, exec, uwsm-app -- xdg-terminal-exec --dir="$(omarchy-cmd-terminal-cwd)" bash -c "tmux attach || tmux new -s Work"
bindd = SUPER, B, Browser, exec, omarchy-launch-browser
bindd = SUPER SHIFT, B, Browser (private), exec, omarchy-launch-browser --private
bindd = SUPER SHIFT, F, File manager, exec, uwsm-app -- nautilus --new-window
bindd = SUPER ALT SHIFT, F, File manager (cwd), exec, uwsm-app -- nautilus --new-window "$(omarchy-cmd-terminal-cwd)"
bindd = SUPER SHIFT, N, Editor, exec, omarchy-launch-editor
bindd = SUPER SHIFT, SLASH, Passwords, exec, uwsm-app -- bitwarden
bindd = SUPER SHIFT, A, Claude, exec, omarchy-launch-webapp "https://claude.com"
bindd = SUPER SHIFT, C, Calendar, exec, omarchy-launch-or-focus-webapp Calendar "https://calendar.google.com/calendar"
bindd = SUPER SHIFT, E, Email, exec, omarchy-launch-or-focus-webapp Gmail "https://mail.google.com/mail/"
bindd = SUPER SHIFT, S, Slack, exec, omarchy-launch-or-focus "^Slack$" "uwsm-app -- slack.desktop"

bindd = SUPER, M, Youtube Music, exec, omarchy-launch-or-focus-webapp "youtube" "https://music.youtube.com"
# Clamshell mode: lid close disables laptop screen, lid open re-enables it.
# Unbind omarchy defaults from bindings/utilities.conf so its
# omarchy-hyprland-monitor-internal helper doesn't also fire and write a
# wildcard `monitor=,disable` toggle when $INTERNAL resolves empty.
unbind = , switch:on:Lid Switch
unbind = , switch:off:Lid Switch
bindl = , switch:on:Lid Switch, exec, hyprctl keyword monitor "eDP-1, disable"
bindl = , switch:off:Lid Switch, exec, hyprctl keyword monitor "eDP-1, 2256x1504@60, auto-left, 1"

# Add extra bindings
# bind = SUPER SHIFT, R, exec, alacritty -e ssh your-server

# --- Window management

# Focus navigation (vim-style, replaces SUPER+Arrow)
unbind = SUPER, LEFT
unbind = SUPER, RIGHT
unbind = SUPER, UP
unbind = SUPER, DOWN
unbind = SUPER, J
unbind = SUPER, K
bindd = SUPER, H, Move window focus left, movefocus, l
bindd = SUPER, J, Move window focus down, movefocus, d
bindd = SUPER, K, Move window focus up, movefocus, u
bindd = SUPER, L, Move window focus right, movefocus, r

# Window swap (vim-style, replaces SUPER+SHIFT+Arrow)
unbind = SUPER SHIFT, LEFT
unbind = SUPER SHIFT, RIGHT
unbind = SUPER SHIFT, UP
unbind = SUPER SHIFT, DOWN
bindd = SUPER SHIFT, H, Swap window left, swapwindow, l
bindd = SUPER SHIFT, J, Swap window down, swapwindow, d
bindd = SUPER SHIFT, K, Swap window up, swapwindow, u
bindd = SUPER SHIFT, L, Swap window right, swapwindow, r

# Window resize (vim-style, replaces SUPER+ALT+Arrow)
unbind = SUPER ALT, LEFT
unbind = SUPER ALT, RIGHT
unbind = SUPER ALT, UP
unbind = SUPER ALT, DOWN
bindde = SUPER ALT, H, Resize window left, resizeactive, -30 0
bindde = SUPER ALT, L, Resize window right, resizeactive, 30 0
bindde = SUPER ALT, K, Resize window up, resizeactive, 0 -30
bindde = SUPER ALT, J, Resize window down, resizeactive, 0 30

# Displaced omarchy defaults → new homes
bindd = SUPER CTRL, J, Toggle window split, layoutmsg, togglesplit
bindd = SUPER CTRL, K, Show key bindings, exec, omarchy-menu-keybindings

# Media keys
bind = ,XF86AudioNext, pass, class:^.*-music\.youtube.*$
bind = ,XF86AudioPause, pass, class:^.*-music\.youtube.*$
bind = ,XF86AudioPlay, pass, class:^.*-music\.youtube.*$

# --- Unbind Omarchy defaults
# Toggle groups
# unbind = SUPER, G, Toggle window grouping, togglegroup
# unbind = SUPER ALT, G, Move active window out of group, moveoutofgroup

unbind = SUPER, Slash

# Join groups
unbind = SUPER ALT, LEFT
unbind = SUPER ALT, RIGHT
unbind = SUPER ALT, UP
unbind = SUPER ALT, DOWN

# Navigate a single set of grouped windows
unbind = SUPER ALT, TAB
unbind = SUPER ALT SHIFT, TAB
unbind = SUPER, TAB
bindd = SUPER, TAB, Next window in group, changegroupactive, f

# Overwrite existing bindings, like putting Omarchy Menu on Super + Space
# unbind = SUPER, SPACE
# bindd = SUPER, SPACE, Omarchy menu, exec, omarchy-menu

# Reminder: date/time flow instead of minutes (overrides omarchy default)
unbind = SUPER CTRL, R
bindd = SUPER CTRL, R, Set reminder, exec, ~/.local/bin/omarchy-reminder-at
unbind = SUPER CTRL ALT, R
bindd = SUPER CTRL ALT, R, Show reminders, exec, ~/.local/bin/omarchy-reminder-at show
unbind = SUPER SHIFT CTRL, R
bindd = SUPER SHIFT CTRL, R, Clear reminders, exec, ~/.local/bin/omarchy-reminder-at clear
