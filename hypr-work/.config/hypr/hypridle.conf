# hypridle config
# Suspend is handled by Hyprland (not logind) — lid switch is ignored by logind
# via /etc/systemd/logind.conf.d/lid.conf so that bindings.conf handles clamshell.
# No suspend listeners — idle just locks and turns off the display.

general {
    lock_cmd = pidof hyprlock || hyprlock &
    unlock_cmd = pkill -USR1 hyprlock  # dismiss hyprlock on unlock
}

listener {
    timeout = 600                      # 10min idle → lock screen
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660                                             # 11min → keyboard backlight off
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

listener {
    timeout = 720                                             # 12min → monitor off
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on && brightnessctl -r
}
