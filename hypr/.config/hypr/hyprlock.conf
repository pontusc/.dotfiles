# Minimal hyprlock — colors match the waybar theme.
# hypridle (auto-lock idle chain) comes in Phase 4.

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(17, 24, 38, 1.0)
}

input-field {
    monitor =
    size = 300, 40
    outline_thickness = 2
    outer_color = rgba(130, 220, 204, 1.0)
    inner_color = rgba(17, 24, 38, 0.9)
    font_color = rgba(221, 221, 221, 1.0)
    check_color = rgba(240, 198, 116, 1.0)
    fail_color = rgba(255, 85, 85, 1.0)
    placeholder_text =
    fade_on_empty = true
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(221, 221, 221, 1.0)
    font_size = 56
    font_family = monospace
    position = 0, 80
    halign = center
    valign = center
}
