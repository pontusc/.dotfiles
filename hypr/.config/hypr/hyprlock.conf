general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot          # whatever's on screen — follows the wallpaper for free
    blur_passes = 3
    color = rgba(26, 27, 38, 1.0)   # #1a1b26 fallback
}

input-field {
    monitor =
    size = 300, 40
    outline_thickness = 2
    outer_color = rgba(122, 162, 247, 1.0)   # blue #7aa2f7
    inner_color = rgba(26, 27, 38, 0.9)      # bg #1a1b26
    font_color = rgba(192, 202, 245, 1.0)    # fg #c0caf5
    check_color = rgba(224, 175, 104, 1.0)   # yellow #e0af68
    fail_color = rgba(247, 118, 142, 1.0)    # red #f7768e
    placeholder_text =
    fade_on_empty = true
    position = 0, -40
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(192, 202, 245, 1.0)         # fg #c0caf5
    font_size = 56
    font_family = JetBrainsMono Nerd Font
    position = 0, 80
    halign = center
    valign = center
}
