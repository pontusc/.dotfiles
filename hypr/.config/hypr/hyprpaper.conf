# hyprpaper — wallpaper daemon. Plain hyprlang conf, same as hypridle (only the
# compositor takes Lua). 0.8+ syntax: wallpaper{} blocks, no preload lines.
# IPC stays on (default) so the wallpaper can be switched at runtime:
#   hyprctl hyprpaper wallpaper ', ~/.config/hypr/wallpapers/<img>'
# Images: omarchy tokyo-night backgrounds, vendored in wallpapers/.

splash = false

wallpaper {
    monitor =                  # empty = fallback for all monitors
    path = ~/.config/hypr/wallpapers/1-sunset-lake.png
    fit_mode = cover
}
