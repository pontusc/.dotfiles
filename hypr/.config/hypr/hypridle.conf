# hypridle — idle chain. hypridle itself reads plain hyprlang conf (this file);
# only the compositor takes Lua, so the `hyprctl dispatch` strings below are Lua
# (see README gotchas) — `dpms off` conf syntax silently fails on this config.
# No suspend-on-idle: suspend stays manual (power menu) / lid comes in Phase 5.

general {
    lock_cmd = pidof hyprlock || hyprlock     # avoid double instances
    unlock_cmd = pkill -USR1 hyprlock         # dismiss hyprlock on dbus unlock
    before_sleep_cmd = loginctl lock-session  # lock *before* suspend; hypridle holds sleep until locked
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'  # no double keypress after resume
}

listener {
    timeout = 600                       # 10min → lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 660                       # 11min → keyboard backlight off
    on-timeout = brightnessctl -sd '*::kbd_backlight' set 0
    on-resume = brightnessctl -rd '*::kbd_backlight'
}

listener {
    timeout = 720                       # 12min → display off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
